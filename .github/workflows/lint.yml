name: lint
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: |
          shellcheck -s bash install.sh bootstrap.sh uninstall.sh firstboot/*.sh test/*.sh
          shellcheck -s bash -e SC2139,SC2142 shell/*.sh bashrc
          bash -n install.sh bootstrap.sh uninstall.sh firstboot/*.sh shell/*.sh bashrc
  debian-install:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - run: apt-get update -qq && apt-get install -y -qq sudo git curl ca-certificates >/dev/null
      - uses: actions/checkout@v4
        with: { submodules: true }
      - run: cp -r . /root/.xt-dotfiles && /root/.xt-dotfiles/install.sh --yes --link --no-chsh
      - run: zsh -i -c 'type ll && type dcu'
