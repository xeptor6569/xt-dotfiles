name: lint
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: |
          shellcheck -S warning -s bash install.sh bootstrap.sh uninstall.sh firstboot/*.sh test/*.sh
          shellcheck -S warning -s bash -e SC2139,SC2142,SC1090,SC1083,SC2034 shell/*.sh bashrc
          bash -n install.sh bootstrap.sh uninstall.sh firstboot/*.sh shell/*.sh bashrc
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'ubuntu:24.04']
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq sudo git curl ca-certificates >/dev/null
      - uses: actions/checkout@v4
        with: { submodules: true }
      - run: cp -r . /root/.xt-dotfiles && /root/.xt-dotfiles/install.sh --yes --link --no-chsh
      - run: zsh -i -c 'type ll && type gs'
      - name: fzf key bindings are loaded
        run: zsh -i -c '[[ $(bindkey "^R") == *fzf* ]]'
      - name: bash startup
        run: bash -i -c 'type ll && type gs'
